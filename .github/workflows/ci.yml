name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deliberately unfiltered by path. Path filters and per-project tags belong to
# Milestone 4, when projects first deploy independently; until then everything ships
# from one commit and filtering would only hide breakage in the half not rebuilt.
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore app-platform.slnx
      - run: dotnet build app-platform.slnx --no-restore -warnaserror
      # privileges.tests needs Docker for Testcontainers; ubuntu-latest provides it.
      # Without a daemon those tests error rather than skip, which is intended — a
      # privilege suite that quietly does not run is worse than one that fails.
      - run: dotnet test app-platform.slnx --no-build --verbosity normal

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # `npm run build` runs `tsc -b`, which type-checks the TEST files too. A bare
      # `vitest run` never type-checks, and `tsc --noEmit` skips them — so a type error in a
      # test would otherwise reach main and fail the image build there instead.
      # `build` is `tsc -b` in every workspace, and it is what type-checks the TEST files. vitest
      # never type-checks, so running only the tests would let a type error in a spec reach main.
      - run: npm run build --workspace @app-platform/web-api
      - run: npm run build --workspace @app-platform/tickets-ui
      - run: npm run build --workspace @app-platform/shell
      - run: npm run test --workspace @app-platform/web-api
      - run: npm run test --workspace @app-platform/tickets-ui
      - run: npm run test --workspace @app-platform/shell

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Built ahead of time so the `dotnet run` inside Playwright's webServer starts a compiled
      # app instead of restoring and building three projects inside a 120s readiness window.
      - run: dotnet build app-platform.slnx
      # The browser leg. It boots the real services against the GENERATED migration scripts, so
      # it is the only test that crosses the seams a browser owns: whether the auth cookie is
      # accepted across services, whether the CSRF token issued at sign-in is usable, and
      # whether the shell fetches the bundle it was told it may have.
      - run: npm run test --workspace @app-platform/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: e2e/test-results/
          retention-days: 7
